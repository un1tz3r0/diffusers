name: Sync fork with upstream

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency: sync-upstream

jobs:
  sync:
    if: github.repository != 'huggingface/diffusers'
    runs-on: ubuntu-latest
    steps:
      # SYNC_TOKEN: a PAT with Contents and Workflows write access, needed
      # because GITHUB_TOKEN may not push upstream's changes to workflow files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Replay this workflow on top of upstream main
        run: |
          set -euo pipefail
          wf=.github/workflows/sync-upstream.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/huggingface/diffusers main
          cp "$wf" "$RUNNER_TEMP/sync-upstream.yml"
          git checkout -B main FETCH_HEAD
          cp "$RUNNER_TEMP/sync-upstream.yml" "$wf"
          git add "$wf"
          git commit -m "Add weekly upstream sync workflow"
          git diff --quiet origin/main && exit 0
          git push --force-with-lease=main:origin/main origin main
